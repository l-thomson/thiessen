url: https://l-thomson.github.io/thiessen/r
template:
  bootstrap: 5
  includes:
    # The package name is provisional, so the site is served but not
    # offered for indexing. Remove once the name is settled.
    in_header: '<meta name="robots" content="noindex, nofollow">'

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]

articles:
- title: Models
  navbar: Models
  desc: >
    One page per published model, each on the same template: the
    likelihood, the priors, what a fit returns, and a worked example
    against a known truth. The model description page holds the
    notation the others cite.
  contents:
  - gaussian
  - binary-addivortes
  - h-addivortes
  - model-description
- title: Using a fit
  navbar: Using a fit
  desc: >
    The draws and the packages that take them, the convergence
    diagnostics and the compute they cost, the priors, the covariate
    space, and every configuration group.
  contents:
  - posterior
  - convergence
  - priors
  - covariates
  - control-surface
- title: Building your own model
  navbar: Extending
  desc: >
    The Gibbs loop as an object driven from R, so an outcome family or a
    censoring scheme the package does not ship is written without Rust.
  contents:
  - sampler-api
- title: Help
  navbar: Help
  contents:
  - troubleshooting
  - related-software

reference:
- title: Fitting
  contents:
  - thiessen
  - thiessen_control
- title: Outcome families
  contents:
  - gaussian_outcome
  - probit_outcome
  - print.thiessen_outcome
- title: Experimental outcome families
  desc: >
    Compiled only into a core built with its `experimental` feature; see
    `experimental_outcomes`.
  contents:
  - tobit_outcome
  - aft_outcome
  - interval_censored_outcome
  - ordinal_outcome
  - student_t_outcome
  - laplace_outcome
  - experimental_outcomes
- title: Parameter groups
  contents:
  - term_params
  - geometry_params
  - structure_params
  - cell_params
  - general_params
  - print.params
  - print.thiessen_control
- title: Experimental component options
  desc: >
    Values of the parameter groups compiled only into a core built with its
    `experimental` feature; see `experimental_outcomes` for the policy.
  contents:
  - soft_membership
  - weighted_inclusion
  - dart_inclusion
  - print.thiessen_option
- title: Fitted-model methods
  contents:
  - predict.thiessen
  - fitted.thiessen
  - sigma.thiessen
  - summary.thiessen
  - print.thiessen
  - plot.thiessen
- title: Posterior and rstantools generics
  contents:
  - as_draws_df.thiessen
  - ndraws.thiessen
  - posterior_predict.thiessen
  - posterior_epred.thiessen
  - log_lik.thiessen
  - predictive_interval.thiessen
  - reexports
- title: Diagnostics
  contents:
  - thiessen_diagnostics
  - variable_inclusion
- title: The sampler API
  contents:
  - thiessen_sampler
  - print.thiessen_sampler
- title: Build information
  contents:
  - core_version
  - core_experimental
  - thiessen-package
