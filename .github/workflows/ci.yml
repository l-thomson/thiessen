name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets --locked ${{ matrix.features }} -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        scope: [""]
        features: [""]
        include:
          - os: ubuntu-latest
            toolchain: stable
            scope: ""
            features: "--features experimental"
          - os: ubuntu-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
          - os: macos-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
          - os: windows-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-nextest
      # The MSRV leg covers the published crate only: the Python extension's
      # dependency set needs 1.75 (python/Cargo.toml).
      - run: cargo nextest run --locked ${{ matrix.scope }} ${{ matrix.features }}
      # nextest does not run doctests
      - run: cargo test --doc --locked ${{ matrix.scope }} ${{ matrix.features }}

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  doc:
    name: doc
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps --locked ${{ matrix.features }}

  semver:
    name: semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history; the baseline revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # No published baseline before the first crates.io release; compare
      # against the merge base instead. The baseline is a worktree outside
      # the checkout rather than `baseline-rev`, which clones into it: the R
      # package vendors a copy of the core, so a scan of either tree for the
      # package named `thiessen` finds it twice. The baseline is read for the
      # core crate's API, so the R package is removed from it, and
      # `manifest-path` names the crate in this tree.
      - run: |
          git worktree add "${{ runner.temp }}/baseline" \
            ${{ github.event.pull_request.base.sha }}
          rm -rf "${{ runner.temp }}/baseline/r"
      # The default heuristic enables a feature named `experimental`.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/thiessen/Cargo.toml
          baseline-root: ${{ runner.temp }}/baseline
          feature-group: default-features

  # Statistical validation is a merge gate, not only a scheduled job. A
  # pull request that touches the sampler kernel, an outcome model, or the
  # calibration harness runs the full-size SBC and Geweke gates; other
  # pull requests stay on the small-size gates in `test`. The ten gates
  # take about forty seconds of test time on a laptop.
  calibration-full:
    name: calibration-full
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CALIBRATION_DIR: ${{ github.workspace }}/calibration-out
    steps:
      # Full history; the base revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: kernel
        run: |
          hit=false
          if git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...HEAD -- \
            crates/thiessen/src/sampler.rs \
            crates/thiessen/src/moves.rs \
            crates/thiessen/src/cells.rs \
            crates/thiessen/src/outcome.rs \
            'crates/thiessen/src/models/*' \
            crates/thiessen/tests/calibration.rs | grep -q .; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.kernel.outputs.hit == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.kernel.outputs.hit == 'true'
      - run: cargo test --locked --release --features experimental --test calibration -- --ignored
        if: steps.kernel.outputs.hit == 'true'
      # A failed gate leaves its rank and sample files for the R
      # evaluation under benchmarks/calibration.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: calibration-full-report
          path: calibration-out


  coverage:
    name: coverage
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --locked ${{ matrix.features }} --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  cff:
    name: cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: --validate

  # The R source tarball is built once, from the vendored sources, and
  # checked as CRAN would on each platform.
  r-source:
    name: r-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - run: tools/vendor.sh
      # Staged by force because the vendored core is ignored: an added file
      # would otherwise be untracked, and so absent from a diff.
      - run: |
          paths="r/DESCRIPTION r/inst/AUTHORS r/src/rust/Cargo.lock \
            r/src/rust/core r/tests/testthat/core-gaussian-chain.txt"
          git add --force $paths
          git diff --cached --exit-code -- $paths
      # The binding crate is outside the root workspace, so the fmt and
      # clippy jobs above do not reach it.
      - run: cargo fmt --check
        working-directory: r/src/rust
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: r/src/rust
      - run: R CMD build r
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-source
          path: thiessen_*.tar.gz

  r-check:
    name: r-check (${{ matrix.os }}, ${{ matrix.r }})
    needs: r-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.r }}
          # r-devel has no binaries on the public RSPM, so it builds the
          # dependencies from source; the agent string selects the release
          # repository for the rest.
          http-user-agent: ${{ matrix.r == 'devel' && 'release' || 'default' }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r-source
      - run: |
          rcmdcheck::rcmdcheck(
            Sys.glob("thiessen_*.tar.gz"),
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-check-${{ matrix.os }}-${{ matrix.r }}
          path: check

  py-lint:
    name: py-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements-lint.txt
      - run: ruff check .
        working-directory: python
      - run: ruff format --check .
        working-directory: python
      - run: mypy
        working-directory: python

  py-coverage:
    name: py-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[sklearn,arviz]" pytest pytest-cov pandas
        working-directory: python
      - run: pytest --cov=thiessen --cov-report=xml
        working-directory: python
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

  py-docs:
    name: py-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The examples run at build, so the package and both extras are needed.
      - run: pip install -e ".[sklearn,arviz]" -r requirements-docs.txt
        working-directory: python
      - run: mkdocs build --strict
        working-directory: python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-docs
          path: python/site

  py-test:
    name: py-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[sklearn,arviz]" pytest pandas
        working-directory: python
      - run: python -m pytest
        working-directory: python

  alls-green:
    name: alls-green
    if: always()
    needs: [fmt, clippy, test, deny, doc, semver, calibration-full, coverage, cff,
            py-lint, py-test, py-coverage, py-docs, r-source, r-check]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # semver and calibration-full run on pull requests only; coverage
          # is informational
          allowed-skips: semver, calibration-full
          allowed-failures: coverage, py-coverage
