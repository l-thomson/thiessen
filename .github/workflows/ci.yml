name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # The deep benchmark-suite run, before a snapshot regeneration and at a
  # release. Nothing here is scheduled: a run is earned by a change or by
  # someone asking for it.
  workflow_dispatch:
    inputs:
      suite_sizes:
        description: Benchmark suite cell sizes
        type: choice
        options: [small, all]
        default: small
      suite_reps_max:
        description: Benchmark suite repetitions per cell, at most
        type: string
        default: "8"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets --locked ${{ matrix.features }} -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        scope: [""]
        features: [""]
        include:
          - os: ubuntu-latest
            toolchain: stable
            scope: ""
            features: "--features experimental"
          - os: ubuntu-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
          - os: macos-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
          - os: windows-latest
            toolchain: "1.74"
            scope: "-p thiessen"
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-nextest
      # The MSRV leg covers the published crate only: the Python extension's
      # dependency set needs 1.75 (python/Cargo.toml).
      - run: cargo nextest run --locked ${{ matrix.scope }} ${{ matrix.features }}
      # nextest does not run doctests
      - run: cargo test --doc --locked ${{ matrix.scope }} ${{ matrix.features }}

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  doc:
    name: doc
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --no-deps --locked ${{ matrix.features }}

  semver:
    name: semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history; the baseline revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # No published baseline before the first crates.io release; compare
      # against the merge base instead. The baseline is a worktree outside
      # the checkout rather than `baseline-rev`, which clones into it: the R
      # package vendors a copy of the core, so a scan of either tree for the
      # package named `thiessen` finds it twice. The baseline is read for the
      # core crate's API, so the R package is removed from it, and
      # `manifest-path` names the crate in this tree.
      - run: |
          git worktree add "${{ runner.temp }}/baseline" \
            ${{ github.event.pull_request.base.sha }}
          rm -rf "${{ runner.temp }}/baseline/r"
      # The default heuristic enables a feature named `experimental`.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/thiessen/Cargo.toml
          baseline-root: ${{ runner.temp }}/baseline
          feature-group: default-features

  # Statistical validation is a merge gate, not only a scheduled job. A
  # pull request that touches the sampler kernel, an outcome model, or the
  # calibration harness runs the full-size SBC and Geweke gates; other
  # pull requests stay on the small-size gates in `test`. The ten gates
  # take about forty seconds of test time on a laptop.
  calibration-full:
    name: calibration-full
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CALIBRATION_DIR: ${{ github.workspace }}/calibration-out
    steps:
      # Full history; the base revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: kernel
        run: |
          hit=false
          if git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...HEAD -- \
            crates/thiessen/src/sampler.rs \
            crates/thiessen/src/moves.rs \
            crates/thiessen/src/cells.rs \
            crates/thiessen/src/outcome.rs \
            'crates/thiessen/src/models/*' \
            crates/thiessen/tests/calibration.rs | grep -q .; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.kernel.outputs.hit == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.kernel.outputs.hit == 'true'
      - run: cargo test --locked --release --features experimental --test calibration -- --ignored
        if: steps.kernel.outputs.hit == 'true'
      # A failed gate leaves its rank and sample files for the R
      # evaluation under benchmarks/calibration.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: calibration-full-report
          path: calibration-out


  # The only performance measurement CI is allowed to gate on. Callgrind
  # counts retired instructions, which is deterministic, so a shared runner
  # measures it as well as a quiet workstation; wall-clock on the same
  # runner carries a few per cent of noise with far larger excursions and
  # lives in `tools/perf-compare.sh` instead.
  #
  # The base revision is measured with the pull request's benchmark code,
  # not its own: the comparison is of the library, so the harness has to be
  # held fixed, and a pull request that adds a benchmark has no counterpart
  # at the base to run.
  #
  # The comparison table goes to the run summary and to one comment on the
  # pull request, edited in place on each push, whether or not the gate
  # trips.
  perf-instructions:
    name: perf-instructions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # One target directory for both runs. gungraun keeps its output under
    # `$CARGO_TARGET_DIR/gungraun`, and `bench/` is its own workspace, so
    # without this the base revision's baseline and the pull request's run
    # land in different directories and nothing is compared.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # Full history; the base revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        run: |
          hit=false
          if git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...HEAD -- \
            'crates/thiessen/src/*' \
            'crates/thiessen/src/models/*' \
            bench | grep -q .; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.paths.outputs.hit == 'true'
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.paths.outputs.hit == 'true'
      # The bench crate is outside the root workspace, so the fmt and
      # clippy jobs above do not reach it.
      - if: steps.paths.outputs.hit == 'true'
        working-directory: bench
        run: cargo fmt --check
      - if: steps.paths.outputs.hit == 'true'
        working-directory: bench
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: steps.paths.outputs.hit == 'true'
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - if: steps.paths.outputs.hit == 'true'
        run: cargo install --locked --version 0.19.4 gungraun-runner
      - if: steps.paths.outputs.hit == 'true'
        run: |
          git worktree add --detach "${{ runner.temp }}/base" \
            ${{ github.event.pull_request.base.sha }}
          rm -rf "${{ runner.temp }}/base/bench"
          cp -r bench "${{ runner.temp }}/base/bench"
      - if: steps.paths.outputs.hit == 'true'
        working-directory: ${{ runner.temp }}/base
        run: |
          cargo bench --manifest-path bench/Cargo.toml \
            --bench instructions -- --save-baseline=base
      # Exits non-zero on a soft-limit breach; the limits are in the bench
      # file. The outcome is read after the table is posted, so a breach
      # is readable on the pull request. Summaries left by a cached target
      # directory are removed first so only this run's benchmarks are read.
      - id: bench
        if: steps.paths.outputs.hit == 'true'
        continue-on-error: true
        run: |
          find "$CARGO_TARGET_DIR/gungraun" -name summary.json -delete
          cargo bench --manifest-path bench/Cargo.toml \
            --bench instructions -- --baseline=base --save-summary=json
      - if: steps.paths.outputs.hit == 'true'
        run: |
          python3 tools/perf-instructions-table.py "$CARGO_TARGET_DIR/gungraun" \
            > perf-instructions.md
          cat perf-instructions.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.paths.outputs.hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/perf-instructions-comment.sh \
            ${{ github.event.pull_request.number }} perf-instructions.md
      - if: steps.paths.outputs.hit == 'true' && steps.bench.outcome == 'failure'
        run: |
          echo "instruction counts breached a soft limit; see the table" >&2
          exit 1

  # The benchmark suite: the scorecard of every shipped model at the fixed
  # cells, compared against the committed reference. The gate reads only
  # the ratios that do not change with the speed of the machine, so a
  # shared runner can be asked about them: effective sample size per sweep
  # and held-out error. Wall-clock columns are reported and gate nothing.
  suite:
    name: suite
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Full history; the base revision is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: kernel
        run: |
          hit=${{ github.event_name == 'workflow_dispatch' }}
          if [ "${{ github.event_name }}" = pull_request ] && git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...HEAD -- \
            'crates/thiessen/src/*' \
            'crates/thiessen/src/models/*' \
            bench benchmarks/suite | grep -q .; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: steps.kernel.outputs.hit == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.kernel.outputs.hit == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.kernel.outputs.hit == 'true'
        with:
          python-version: "3.12"
      - if: steps.kernel.outputs.hit == 'true'
        run: pip install -r benchmarks/suite/requirements.txt
      - if: steps.kernel.outputs.hit == 'true'
        run: |
          python benchmarks/suite/run.py \
            --sizes "${{ inputs.suite_sizes || 'small' }}" \
            --reps-max "${{ inputs.suite_reps_max || '3' }}" \
            --scorecard scorecard.csv
      # The newest committed reference; they are named for the core
      # version they were taken at and sort in version order.
      - if: steps.kernel.outputs.hit == 'true'
        run: |
          baseline=$(ls benchmarks/suite/baselines/*.csv | sort -V | tail -1)
          echo "comparing against $baseline"
          python benchmarks/suite/compare.py --gate "$baseline" scorecard.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.kernel.outputs.hit == 'true'
        with:
          name: suite-scorecard
          path: scorecard.csv

  coverage:
    name: coverage
    strategy:
      matrix:
        features: ["", "--features experimental"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --locked ${{ matrix.features }} --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  cff:
    name: cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: --validate

  # The R source tarball is built once, from the vendored sources, and
  # checked as CRAN would on each platform.
  r-source:
    name: r-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - run: tools/vendor.sh
      # Staged first: an added file is untracked, and so absent from a diff.
      # Fails on a stale committed core, archive, AUTHORS or chain fixture.
      - run: |
          paths="r/DESCRIPTION r/inst/AUTHORS r/src/rust/Cargo.lock \
            r/src/rust/core r/src/rust/vendor.tar.xz \
            r/tests/testthat/core-gaussian-chain.txt \
            r/tests/testthat/core-probit-chain.txt \
            r/tests/testthat/core-heteroscedastic-chain.txt"
          git add $paths
          git diff --cached --exit-code -- $paths
      # The binding crate is outside the root workspace, so the fmt and
      # clippy jobs above do not reach it.
      - run: cargo fmt --check
        working-directory: r/src/rust
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: r/src/rust
      # R CMD build installs the package to rebuild the vignettes, so the
      # dependencies must be present before the build.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
      - run: R CMD build r
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-source
          path: thiessen_*.tar.gz

  r-check:
    name: r-check (${{ matrix.os }}, ${{ matrix.r }}${{ matrix.experimental && ', experimental' || '' }})
    needs: r-source
    strategy:
      fail-fast: false
      matrix:
        # The released artefact has the core's `experimental` feature off and
        # the suite branches on the setting, so both states are checked.
        include:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release', experimental: '1'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.r }}
          # r-devel has no binaries on the public RSPM, so it builds the
          # dependencies from source; the agent string selects the release
          # repository for the rest.
          http-user-agent: ${{ matrix.r == 'devel' && 'release' || 'default' }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r-source
      - run: |
          rcmdcheck::rcmdcheck(
            Sys.glob("thiessen_*.tar.gz"),
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}
        env:
          THIESSEN_EXPERIMENTAL: ${{ matrix.experimental }}
      - if: matrix.experimental
        run: stopifnot(thiessen::core_experimental())
        shell: Rscript {0}
        env:
          R_LIBS: check/thiessen.Rcheck
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-check-${{ matrix.os }}-${{ matrix.r }}${{ matrix.experimental && '-experimental' || '' }}
          path: check

  r-docs:
    name: r-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
          extra-packages: any::pkgdown
      # The vignettes and examples run at build against the installed
      # package, so the site build is the executed-documentation gate.
      - run: |
          install.packages(".", repos = NULL, type = "source")
          pkgdown::build_site_github_pages(".")
        shell: Rscript {0}
        working-directory: r
      # README.md is knitted from README.Rmd; a stale one is a wrong
      # front page.
      - run: rmarkdown::render("README.Rmd", quiet = TRUE)
        shell: Rscript {0}
        working-directory: r
      - run: git diff --exit-code -- r/README.md
      # Published under /r/, leaving the root for the shared index. `clean`
      # deletes stale files under `target-folder` only (the action rsyncs
      # into it with --delete), so the sites beside it are untouched.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: r/docs
          target-folder: r
          clean: true
      # A pull request reads the site as an artefact instead.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-docs
          path: r/docs

  py-lint:
    name: py-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements-lint.txt
      - run: ruff check .
        working-directory: python
      - run: ruff format --check .
        working-directory: python
      - run: mypy
        working-directory: python

  py-coverage:
    name: py-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[sklearn,arviz]" pytest pytest-cov pandas
        working-directory: python
      - run: pytest --cov=thiessen --cov-report=xml
        working-directory: python
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

  py-docs:
    name: py-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The examples run at build, so the package and both extras are needed.
      - run: pip install -e ".[sklearn,arviz]" -r requirements-docs.txt
        working-directory: python
      - run: mkdocs build --strict
        working-directory: python
      # Published under /python/; `clean` is confined to that folder, as
      # for the R site.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: python/site
          target-folder: python
          clean: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py-docs
          path: python/site

  # The landing page at the site root. Without `clean`, the deploy adds
  # its files and removes nothing, so r/ and python/ are untouched.
  pages-root:
    name: pages-root
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs/site-root
          clean: false

  py-test:
    name: py-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_args: [""]
        # The released wheel has the core's `experimental` feature off and
        # the suite branches on the setting, so both states are run.
        include:
          - os: ubuntu-latest
            build_args: "--features experimental"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          pip install -e ".[sklearn,arviz]" pytest pandas
          ${{ matrix.build_args && format('--config-settings build-args="{0}"', matrix.build_args) || '' }}
        working-directory: python
      - if: matrix.build_args != ''
        run: python -c "from thiessen import _native; assert _native.EXPERIMENTAL"
        working-directory: python
      - run: python -m pytest
        working-directory: python

  # The one required status on `dev`. Branch protection matches the
  # context by name, so no other workflow may define a job called
  # `alls-green`.
  alls-green:
    name: alls-green
    if: always()
    needs: [fmt, clippy, test, deny, doc, semver, calibration-full,
            perf-instructions, suite, coverage, cff,
            py-lint, py-test, py-coverage, py-docs,
            r-source, r-check, r-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test "$(grep -l '^  alls-green:' .github/workflows/*.yml)" = .github/workflows/ci.yml
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # semver, calibration-full, perf-instructions and suite run on
          # pull requests only; coverage is informational
          allowed-skips: semver, calibration-full, perf-instructions, suite
          allowed-failures: coverage, py-coverage
