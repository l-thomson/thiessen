name: nightly

on:
  schedule:
    - cron: "14 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-nextest
      # The variants tests read the output of the R scripts under
      # benchmarks/upstream, which is not present here; they run by hand.
      - run: >
          cargo nextest run --locked --features experimental --run-ignored all
          -E 'not binary(variants)'

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-mutants
      # Report only; surviving mutants do not fail the run.
      - run: cargo mutants --locked --features experimental
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants.out

  calibration:
    name: calibration
    runs-on: ubuntu-latest
    env:
      CALIBRATION_DIR: ${{ github.workspace }}/calibration-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --release --features experimental --test calibration -- --ignored
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("remotes", "ggplot2"))'
      # The SBC package is not on CRAN; pinned to a commit. remotes reads
      # the GitHub API, so it needs the workflow token.
      - run: Rscript -e 'remotes::install_github("hyunjimoon/SBC@3a8e632fd4d9e117073761d07502c730cbcac85b", upgrade = "never")'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - run: Rscript benchmarks/calibration/evaluate.R "$CALIBRATION_DIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: calibration-report
          path: calibration-out

  file-issue:
    name: file-issue
    if: failure()
    needs: [full-suite, mutants, calibration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: >
          printf '%s\n' '---' 'title: "nightly: scheduled run failed"'
          'labels: ci' '---'
          'The scheduled nightly run failed: {{ env.RUN_URL }}'
          > nightly-failure.md
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        with:
          filename: nightly-failure.md
          update_existing: true
