[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "thiessen"
version = "0.1.0"
description = "Bayesian additive Voronoi tessellations (AddiVortes)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Leo Thomson", email = "hello@leothomson.dev" }]
keywords = ["bayesian", "mcmc", "regression", "voronoi", "nonparametric"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.6"]
arviz = ["arviz>=1.0"]

[project.urls]
Homepage = "https://github.com/l-thomson/thiessen"
Repository = "https://github.com/l-thomson/thiessen"
Issues = "https://github.com/l-thomson/thiessen/issues"
Changelog = "https://github.com/l-thomson/thiessen/blob/dev/python/CHANGELOG.md"

[tool.maturin]
module-name = "thiessen._native"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N", "UP", "B", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.per-file-ignores]
# Test names carry the statement; a docstring would repeat it.
"tests/**" = ["D"]

[tool.ruff.lint.extend-per-file-ignores]
# D105: the dunder and protocol methods carry the semantics of their
# protocol, so a docstring would only restate the signature.
"python/thiessen/*.py" = ["D105"]

[tool.ruff.lint.pep8-naming]
# `X` for the design is the scikit-learn convention.
extend-ignore-names = ["X"]

[tool.mypy]
# No `python_version`: mypy no longer targets 3.9, and numpy's stubs need the
# running interpreter. Ruff's `target-version` holds the 3.9 floor.
files = ["python/thiessen", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "thiessen._native"
ignore_missing_imports = true

# Neither scikit-learn nor arviz ships py.typed, and pandas keeps its stubs
# in a separate package. pytest-benchmark is a benchmark-only dependency and
# is absent from the lint environment.
[[tool.mypy.overrides]]
module = ["arviz.*", "pandas.*", "pytest_benchmark.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "thiessen.estimators"
disallow_subclassing_any = false

# Lenient on the tests: a test's name states its subject, and annotating the
# fixtures and assertions adds nothing a reader needs.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmarks need pytest-benchmark and take minutes; they are run by
# hand against two revisions and reported in the pull request, never in CI.
addopts = "--ignore=tests/benchmarks"
